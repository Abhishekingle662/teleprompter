<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Teleprompter Remote</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      gap: 20px;
    }

    h1 { font-size: 18px; font-weight: 600; opacity: 0.8; }

    #connect-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 340px;
    }

    #connect-form input {
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.07);
      color: #fff;
      font-size: 15px;
      width: 100%;
    }

    #connect-form input::placeholder { opacity: 0.4; }

    button {
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    button:active { opacity: 0.75; transform: scale(0.97); }

    #btn-connect {
      background: #3b82f6;
      color: #fff;
      width: 100%;
    }

    #status {
      font-size: 13px;
      opacity: 0.55;
      text-align: center;
    }

    #status.connected { color: #4ade80; opacity: 1; }
    #status.error     { color: #f87171; opacity: 1; }

    #controls {
      display: none;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 340px;
    }

    #controls.visible { display: flex; }

    .btn-row {
      display: flex;
      gap: 12px;
    }

    .btn-row button { flex: 1; }

    #btn-toggle {
      background: #22c55e;
      color: #fff;
      font-size: 20px;
      padding: 22px;
    }

    #btn-toggle.playing { background: #ef4444; }

    #btn-faster  { background: #f59e0b; color: #000; }
    #btn-slower  { background: #6366f1; color: #fff; }
    #btn-reset   { background: rgba(255,255,255,0.1); color: #fff; }
  </style>
</head>
<body>
  <h1>Teleprompter Remote</h1>

  <div id="connect-form">
    <input id="ws-url" type="text" placeholder="ws://192.168.x.x:PORT" autocomplete="off" autocorrect="off" spellcheck="false" />
    <button id="btn-connect">Connect</button>
  </div>

  <div id="status">Not connected</div>

  <div id="controls">
    <button id="btn-toggle">▶ Play</button>
    <div class="btn-row">
      <button id="btn-faster">⬆ Faster</button>
      <button id="btn-slower">⬇ Slower</button>
    </div>
    <button id="btn-reset">↩ Reset to Top</button>
  </div>

  <script>
    let ws = null;
    let playing = false;

    const urlInput   = document.getElementById('ws-url');
    const btnConnect = document.getElementById('btn-connect');
    const statusEl   = document.getElementById('status');
    const controlsEl = document.getElementById('controls');
    const btnToggle  = document.getElementById('btn-toggle');
    const btnFaster  = document.getElementById('btn-faster');
    const btnSlower  = document.getElementById('btn-slower');
    const btnReset   = document.getElementById('btn-reset');

    // Pre-fill from query string: remote.html?ws=ws://192.168.1.5:9001
    const params = new URLSearchParams(location.search);
    if (params.get('ws')) urlInput.value = params.get('ws');

    function send(action) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ action }));
      }
    }

    function setStatus(msg, cls) {
      statusEl.textContent = msg;
      statusEl.className = cls || '';
    }

    function connect() {
      const url = urlInput.value.trim();
      if (!url) return;

      if (ws) { ws.close(); ws = null; }

      setStatus('Connecting…');
      ws = new WebSocket(url);

      ws.onopen = () => {
        setStatus('Connected ✓', 'connected');
        controlsEl.classList.add('visible');
        document.getElementById('connect-form').style.display = 'none';
      };

      ws.onclose = () => {
        setStatus('Disconnected — tap Connect to retry', 'error');
        controlsEl.classList.remove('visible');
        document.getElementById('connect-form').style.display = 'flex';
        playing = false;
        btnToggle.textContent = '▶ Play';
        btnToggle.classList.remove('playing');
      };

      ws.onerror = () => setStatus('Connection error', 'error');
    }

    btnConnect.addEventListener('click', connect);
    urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') connect(); });

    btnToggle.addEventListener('click', () => {
      playing = !playing;
      send(playing ? 'play' : 'pause');
      btnToggle.textContent = playing ? '⏸ Pause' : '▶ Play';
      btnToggle.classList.toggle('playing', playing);
    });

    btnFaster.addEventListener('click', () => send('faster'));
    btnSlower.addEventListener('click', () => send('slower'));
    btnReset.addEventListener('click',  () => { send('reset'); playing = false; btnToggle.textContent = '▶ Play'; btnToggle.classList.remove('playing'); });
  </script>
</body>
</html>
